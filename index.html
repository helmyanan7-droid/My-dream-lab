const state={tab:'cases',caseView:'list',editingCaseId:null,doctors:[],priceList:[],cases:[],doctorPayments:[],search:'',loaded:false,currentCase:null,reportFilters:{doctorId:'',from:'',to:''},searchFilters:{doctorId:'',from:'',to:''},settings:{pin:'',editPin:'',numerals:'en'},lastDoctorId:'',labDetailId:null,editingDoctorId:null,
incompleteCaseGuard:false,locked:false,settingsUnlocked:false};

function doctorName(id){const d=state.doctors.find(x=>x.id===id);return d?d.name:'—'}function priceOf(id){const p=state.priceList.find(x=>x.id===id);return p?Number(p.price)||0:0}function paidOf(c){return(c.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0)}function caseTotals(c){const u=(c.items||[]).reduce((s,it)=>s+(Number(it.price)||0)*(Number(it.qty)||1),0);const total=u;const paid=paidOf(c);return{unitsTotal:u,total,paid,due:Math.max(0,total-paid)}}function fmt(n){return(Number(n)||0).toLocaleString(state.settings.numerals==='ar'?'ar-EG':'en-US',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function backupPayload(){return {app:'My Dream Dental Lab',version:6,createdAt:new Date().toISOString(),doctors:state.doctors,priceList:state.priceList,cases:state.cases,doctorPayments:state.doctorPayments,settings:state.settings,lastDoctorId:state.lastDoctorId}}

state.doctorPayments.filter(p=>p.doctorId===doctorId&&(!from||p.date>=from)&&(!to||p.date<=to)).forEach(p=>paymentRows.push({date:p.date||'—',amount:Number(p.amount||0),note:p.note||'',caseCode:'دفعة للمعمل',id:p.id}));

function nav(){return`<div class="bottom-nav">${[['cases','list','الحالات'],['doctors','doc','المعامل والحسابات'],['prices','money','الأسعار'],['export','file','التصدير'],['settings','gear','الإعدادات']].map(x=>`<button class="nav-btn ${state.tab===x[0]?'active':''}" data-tab="${x[0]}"><span class="nav-icon-wrap">${icon(x[1])}</span><span>${x[2]}</span></button>`).join('')}</div>`}
function casesTab(){if(state.caseView==='form')return caseForm();let q=state.search.trim(),list=state.cases.slice().sort((a,b)=>b.createdAt-a.createdAt);if(q)list=list.filter(c=>(c.code||'').includes(q)||doctorName(c.doctorId).includes(q));let total=state.cases.reduce((s,c)=>s+caseTotals(c).total,0),due=state.cases.reduce((s,c)=>s+caseTotals(c).due,0);return`<div class="stat-cards"><div class="stat-card accentc"><div class="l">عدد الحالات</div><div class="v">${state.cases.length}</div></div><div class="stat-card"><div class="l">إجمالي المستحقات</div><div class="v">${fmt(total)} ج.م</div></div><div class="stat-card"><div class="l">المتبقي غير المحصل</div><div class="v" style="color:var(--danger)">${fmt(due)} ج.م</div></div></div><div class="panel"><div class="panel-head"><div><h2>سجل الحالات</h2><div class="sub">كل الحالات المسجلة في المعمل</div></div><button class="btn btn-primary" id="new-case">${icon('plus')} حالة جديدة</button></div><div class="search-box" style="margin-bottom:12px">${icon('search')}<input id="search" placeholder="ابحث بكود الحالة أو اسم المعمل" value="${esc(state.search)}"></div><div class="table-wrap"><table><thead><tr><th>الكود</th><th>المعمل</th><th>الاستلام</th><th>الإجمالي</th><th>المدفوع</th><th>الباقي</th><th></th></tr></thead><tbody>${list.length?list.map(c=>{let t=caseTotals(c);return`<tr><td><strong>${esc(c.code)}</strong></td><td>${esc(doctorName(c.doctorId))}</td><td>${c.receiveDate||'—'}</td><td>${fmt(t.total)}</td><td>${fmt(t.paid)}</td><td>${t.due?`<span class="badge due">${fmt(t.due)}</span>`:`<span class="badge settled">مسدد</span>`}</td><td><button class="btn btn-ghost btn-sm" data-edit="${c.id}">${icon('edit')}</button><button class="btn btn-ghost btn-sm btn-danger" data-del="${c.id}">${icon('trash')}</button></td></tr>`}).join(''):'<tr class="empty-row"><td colspan="7">لا توجد حالات بعد</td></tr>'}</tbody></table></div></div>`}
function caseForm(){let c=state.currentCase,t=caseTotals(c);return`<div class="panel"><div class="panel-head"><button class="btn btn-ghost btn-sm" id="back">${icon('back')} رجوع</button><h2>${state.editingCaseId?'تعديل حالة':'حالة جديدة'} — ${esc(c.code)}</h2><button class="btn btn-primary" id="save-case">${icon('save')} حفظ الحالة</button></div><div class="field" style="max-width:420px"><label>المعمل</label><select id="lab"><option value="">اختر المعمل</option>${state.doctors.map(d=>`<option value="${d.id}" ${c.doctorId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input type="date" id="date" value="${c.receiveDate||''}"></div><div class="table-wrap"><table><thead><tr><th>نوع التركيبة</th><th>سعر الوحدة</th><th>الكمية</th><th>الإجمالي</th><th></th></tr></thead><tbody>${c.items.length?c.items.map(it=>{return`<tr><td><select data-f="restorationId" data-id="${it.id}"><option value="">اختر النوع</option>${state.priceList.map(p=>`<option value="${p.id}" ${it.restorationId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td><td><strong>${fmt(it.price)}</strong></td><td><select data-f="qty" data-id="${it.id}">${Array.from({length:100},(_,i)=>i+1).map(n=>`<option ${Number(it.qty)===n?'selected':''}>${n}</option>`).join('')}</select></td><td><strong>${fmt((Number(it.price)||0)*(Number(it.qty)||1))}</strong></td><td><button class="btn btn-ghost btn-sm btn-danger" data-rem-item="${it.id}">${icon('trash')}</button></td></tr>`}).join(''):'<tr class="empty-row"><td colspan="5">اضغط إضافة صنف لبدء إضافة التركيبات</td></tr>'}</tbody></table></div><button class="btn btn-sm" id="add-item" style="margin-top:10px">${icon('plus')} إضافة صنف</button><div class="totals-bar"><div class="total-chip"><div class="l">عدد الأصناف</div><div class="v">${c.items.length}</div></div><div class="total-chip"><div class="l">الإجمالي</div><div class="v">${fmt(t.total)}</div></div></div></div>`}

    if(!display) return;
    let expr="";
    const paint=()=>display.value=expr||"0";
    root.addEventListener("click",e=>{
      const b=e.target.closest("[data-calc]");
      if(!b) return;
      const v=b.dataset.calc;
      if(v==="C"){expr="";paint();return}
      if(v==="back"){expr=expr.slice(0,-1);paint();return}
      if(v==="="){
        try{
          if(!/^[0-9+\-*/().%\s]+$/.test(expr)) throw 0;
          let s=expr.replace(/%/g,"/100");
          let result=Function('"use strict";return ('+s+')')();
          if(!Number.isFinite(result)) throw 0;
          expr=String(Math.round(result*100000000)/100000000);
        }catch{expr="خطأ"}
        paint(); return;
      }
      if(expr==="خطأ") expr="";
      expr += v;
      paint();
    });
    paint();
  }
  window.initMyDreamCalculator=initCalculator;
  document.querySelectorAll(".calculator-panel").forEach(initCalculator);
})();
</script>
